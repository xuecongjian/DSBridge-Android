plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    buildToolsVersion "34.0.0"

    namespace "wendu.jsbdemo"    // 新增必要命名空间

    defaultConfig {
        applicationId "wendu.jsbdemo"
        minSdk 21    // 升级最低支持版本（原11已过时）
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true    // 建议启用代码压缩
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true         // 建议开启严格Lint检查
    }

    sourceSets {
        main {
            res.srcDirs = ['src/main/res']  // 确保路径正确
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // 模块依赖
    implementation project(':dsbridge')

    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    // 第三方库
    implementation 'androidx.appcompat:appcompat:1.7.0'       // 替换旧版support库
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.14' // 升级OkHttp到最新稳定版
}




