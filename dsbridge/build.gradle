plugins {
    id 'com.android.library'
}

android {
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        minSdk 21    // 最低支持版本升级到Android 5.0
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true    // 建议启用代码压缩
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true         // 开启严格Lint检查
        checkDependencies true    // 检查传递依赖
    }

    namespace 'wendu.dsbridge'     // 必须的命名空间声明
}

dependencies {
    // 基础依赖
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX 兼容库
    implementation 'androidx.appcompat:appcompat:1.7.0'  // 替换旧版support库

    // 测试框架
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}